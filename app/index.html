<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>make.fun — open bounties</title><style>
:root{--ink:#17231f;--mut:#6f7d72;--line:#dce3dc;--paper:#f4f6f2;--deep:#173a30;--lime:#c9f36d}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,sans-serif}a{color:#3d6b2f}header{position:sticky;top:0;z-index:5;display:flex;gap:14px;align-items:center;background:#fff;border-bottom:1px solid var(--line);padding:10px 18px}.brand{font-weight:800;font-size:19px;text-decoration:none;color:var(--ink);letter-spacing:-.5px}.brand b{color:#79a82d}#q{margin-left:auto;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;width:200px;background:#f5f7f3}main{max-width:1080px;margin:0 auto;padding:28px 18px 50px}.hero{background:var(--deep);color:#fff;border-radius:14px;padding:26px 28px}.hero h1{font:500 34px/1.1 Georgia,serif;margin:8px 0;letter-spacing:-1px}.hero h1 em{color:var(--lime);font-style:normal}.eyebrow{font-size:10px;font-weight:800;letter-spacing:1.4px;color:#8a9a8e}.hero .eyebrow{color:#c2d4c8}.size{font-size:11px;color:var(--mut);margin:12px 2px 26px}h2{font-size:22px;letter-spacing:-.5px;margin:4px 0 14px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.card{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;color:inherit;text-decoration:none}.card.ended{opacity:.65}.cat{font-size:9px;font-weight:800;letter-spacing:1px;color:#547338;background:#edf5df;padding:4px 7px;border-radius:5px}.card h3{font-size:17px;line-height:1.25;margin:10px 0 4px}.card p{font-size:12px;color:#6d7a70;margin:0 0 10px;max-height:3em;overflow:hidden}.pot{font-size:24px;font-weight:750;letter-spacing:-.5px}.meta{display:flex;justify-content:space-between;border-top:1px solid #edf0ec;margin-top:10px;padding-top:9px;font-size:11px}.meta small{display:block;font-size:8px;letter-spacing:.8px;color:#87938b;font-weight:800}.pg{display:flex;gap:14px;justify-content:center;align-items:center;margin-top:20px;font-size:12px;color:var(--mut)}button{background:#fff;border:1px solid var(--line);border-radius:7px;padding:8px 12px;font:700 11px system-ui;cursor:pointer;color:var(--ink);text-decoration:none}button:disabled{opacity:.4}.load,.err{padding:26px;background:#fff;border:1px solid var(--line);border-radius:10px;color:#728078;font-size:13px}.err{color:#a34e38}footer{max-width:1080px;margin:auto;border-top:1px solid var(--line);padding:16px 18px;font-size:10px;color:#86928a}@media(max-width:700px){#q{width:130px}.hero h1{font-size:28px}}
</style></head>
<body>
<header><a class="brand" href="#/">make<b>.</b>fun</a><input id="q" type="search" placeholder="Search bounties"></header>
<main id="m"></main>
<footer>make.fun · open work, openly scored</footer>
<script type="module">
const API='https://make.fun/api',C=new Map(),$=s=>document.querySelector(s),M=$('#m');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const left=s=>{if(!s)return'No deadline';let h=(new Date(s)-Date.now())/36e5|0;if(h<=0)return'Closed';return h/24|0?h/24|0+'d '+h%24+'h left':Math.max(1,h)+'h left'};
async function get(u){let x=C.get(u);if(x&&Date.now()-x.t<6e4)return x.d;let r=await fetch(API+u);if(!r.ok)throw Error('API '+r.status);let d=await r.json();C.set(u,{d:d,t:Date.now()});return d}
function route(){let a=decodeURIComponent(location.hash.slice(2)).split('/');if(a[0]=='bounty')return{k:a[2]=='leaderboard'?'l':'c',s:a[1]};if(a[0]=='account')return{k:'p',h:a[1]};return{k:'b'}}
const A={get,esc,money,left,M};
let items=[],page=1;
function card(x){let p=x.potUsd??x.rewardAmount??0,e=x.deadline&&new Date(x.deadline)<=Date.now();return '<a class="card'+(e?' ended':'')+'" href="#/bounty/'+encodeURIComponent(x.slug)+'"><span class="cat">'+esc(x.category||'OPEN')+'</span><h3>'+esc(x.title)+'</h3><p>'+esc(x.summary||x.description||'')+'</p><span class="pot">'+money(p)+'</span><span class="meta"><span><small>ENTRY</small><b>'+(x.entryFeeUsd?money(x.entryFeeUsd):'Free')+'</b></span><span><small>'+(e?'DEADLINE':'TIME LEFT')+'</small><b>'+(e?'Closed':left(x.deadline))+'</b></span><span><small>ENTRIES</small><b>'+Number(x.submissionCount??0).toLocaleString()+'</b></span></span></a>'}
function draw(){let q=$('#q').value.trim().toLowerCase(),f=items.filter(x=>x.title.toLowerCase().includes(q)),t=Math.max(1,Math.ceil(f.length/12));page=Math.min(page,t);$('#cards').innerHTML=f.slice((page-1)*12,page*12).map(card).join('')||'<div class="load">No bounties match.</div>';$('#pg').innerHTML=t>1?'<button '+(page==1?'disabled':'')+' data-p="'+(page-1)+'">← Prev</button><span>'+page+' / '+t+'</span><button '+(page==t?'disabled':'')+' data-p="'+(page+1)+'">Next →</button>':''}
async function board(){M.innerHTML='<div class="hero"><div class="eyebrow">MAKE.FUN / THE OPEN BOARD</div><h1>Good work<br><em>gets rewarded.</em></h1></div><div class="size">1 file · <b>3008 bytes</b> gzip · 60 s cache · no framework</div><div class="eyebrow">CURRENT OPPORTUNITIES</div><h2>Bounties</h2><div id="cards" class="cards"><div class="load">Loading live competitions…</div></div><div id="pg" class="pg"></div>';try{let d=await get('/competitions?status=open&activity=times');items=(d.items||[]).sort((a,b)=>{let ae=a.deadline&&new Date(a.deadline)<=Date.now(),be=b.deadline&&new Date(b.deadline)<=Date.now();return (ae-be)||((b.potUsd??b.rewardAmount??0)-(a.potUsd??a.rewardAmount??0))||(new Date(a.deadline||1e15)-new Date(b.deadline||1e15))});page=1;draw()}catch(e){$('#cards').innerHTML='<div class="err">Could not load competitions.</div>'}finally{window.__shotReady=true}}
async function render(){window.__shotReady=false;let r=route();if(r.k=='b')return board();if(r.k=='c')return(await import('./bounty.js')).bounty(r.s,A);if(r.k=='l')return(await import('./leaderboard.js')).leaders(r.s,A);return(await import('./profile.js')).profile(r.h,A)}
$('#q').addEventListener('input',()=>{page=1;if(items.length&&document.querySelector('#cards'))draw()});
M.addEventListener('click',e=>{let b=e.target.closest('[data-p]');if(b){page=+b.dataset.p;draw();scrollTo(0,0)}});
addEventListener('hashchange',render);render();
</script></body></html>
